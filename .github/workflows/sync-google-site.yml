name: Sync Google Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: homepage-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test mirror path handling and failure safeguards
        run: python -m unittest discover -s tests -v
      - name: Mirror complete homepage and interactive sites
        run: python scripts/sync_google_site.py
      - name: Commit validated mirror
        run: |
          git add -A -- .
          if git diff --cached --quiet; then
            echo "Mirror is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync complete homepage and interactive demos"
          git push
      # GITHUB_TOKEN pushes do not start another Pages workflow. Deploy the
      # validated snapshot explicitly in this run, including unchanged mirrors.
      - name: Package public site
        run: |
          mkdir -p /tmp/homepage-pages
          python - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('.')
          output = pathlib.Path('/tmp/homepage-pages')
          files = list(json.loads((root / 'sync-state.json').read_text())['files'])
          files += ['.nojekyll', '404.html', 'robots.txt', 'sync-state.json', 'sync-trace.json']
          for name in files:
              target = output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / name, target)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/homepage-pages
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
