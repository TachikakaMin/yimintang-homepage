name: Sync Google Site

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh public content and local assets
        run: python scripts/sync_google_site.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Mirror is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.html sync-state.json assets/generated
          git commit -m "chore: sync Google Sites mirror"
          git push
